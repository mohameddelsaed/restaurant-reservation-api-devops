services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: restaurant-reservation-api
    env_file:
      - .env
    expose:
      - "3000"
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: restaurant-reservation-nginx
    ports:
      - "8081:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
    restart: unless-stopped